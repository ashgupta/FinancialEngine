[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/yf/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/options/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/ibkr/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/ai/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/momentum/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/sector/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/volatility/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/crash/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/social/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/cot/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

# SPA fallback — any non-API GET serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
